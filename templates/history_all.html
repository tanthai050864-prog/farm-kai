<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{
font-family:Segoe UI;
background:#002c7a;
padding:20px;
margin:0;
color:white;
}

.back{
position:fixed;
top:15px;
left:15px;
background:white;
color:#002c7a;
padding:12px 18px;
border-radius:14px;
text-decoration:none;
font-weight:bold;
}

h1{
text-align:center;
margin:70px 0 30px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:25px;
max-width:900px;
margin:auto;
}

.card{
background:white;
color:#002c7a;
padding:35px;
border-radius:24px;
text-align:center;
text-decoration:none;
font-weight:bold;
font-size:22px;
box-shadow:0 15px 30px rgba(0,0,0,.25);
}
</style>
</head>
<body>

<a class="back" href="/">⬅ กลับ</a>

<h1>📚 ประวัติการรับฝากผสม</h1>

<div class="grid">

<a class="card" href="/history_in">
📥 ประวัติรับเข้า
</a>

<a class="card" href="/history_out">
📤 ประวัติส่งออก
</a>

</div>

</body>
</html>
