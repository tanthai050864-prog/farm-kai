<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
@import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;700&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Prompt',sans-serif;
}

body{
background:linear-gradient(135deg,#eef8f1,#dff0e3);
padding:35px;
color:#243d2e;
}

.wrap{
max-width:1400px;
margin:auto;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:35px;
flex-wrap:wrap;
gap:15px;
}

.title{
font-size:44px;
font-weight:700;
color:#2d5a3f;
}

.back{
background:white;
padding:14px 22px;
border-radius:16px;
text-decoration:none;
color:#2d5a3f;
font-weight:700;
box-shadow:0 10px 20px rgba(0,0,0,.08);
transition:.25s;
}

.back:hover{
transform:translateY(-4px);
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
gap:28px;
}

.card{
background:white;
padding:40px;
border-radius:30px;
text-align:center;
text-decoration:none;
color:#243d2e;
box-shadow:0 20px 40px rgba(0,0,0,.06);
transition:.25s;
}

.card:hover{
transform:translateY(-8px);
}

.icon{
font-size:70px;
margin-bottom:20px;
}

.name{
font-size:28px;
font-weight:700;
color:#2d5a3f;
}

.sub{
margin-top:12px;
font-size:17px;
color:#666;
}

.in{
background:linear-gradient(145deg,#4caf50,#2d5a3f);
color:white;
}

.out{
background:linear-gradient(145deg,#8b5e3c,#5c3a21);
color:white;
}

.in .name,
.out .name{
color:white;
}

.in .sub,
.out .sub{
color:rgba(255,255,255,.85);
}

@media(max-width:900px){
.title{
font-size:32px;
}
.name{
font-size:22px;
}
}
</style>
</head>
<body>

<div class="wrap">

<div class="top">
<div class="title">📚 Smart Farm History</div>
<a class="back" href="/">← กลับ</a>
</div>

<div class="grid">

<a class="card in" href="/history_in">
<div class="icon">📥</div>
<div class="name">ประวัติรับเข้า</div>
<div class="sub">รายการฝากผสมทั้งหมด</div>
</a>

<a class="card out" href="/history_out">
<div class="icon">📤</div>
<div class="name">ประวัติส่งออก</div>
<div class="sub">รายการจบงานและส่งคืน</div>
</a>

</div>

</div>

</body>
</html>
