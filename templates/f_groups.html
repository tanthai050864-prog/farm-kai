<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
@import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;700&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Prompt',sans-serif;
}

body{
background:
radial-gradient(circle at top left,#1b4b2c,#102218 40%),
linear-gradient(135deg,#08130d,#102218,#183926);
min-height:100vh;
padding:40px;
color:white;
}

.wrap{
max-width:1400px;
margin:auto;
}

.back{
position:fixed;
top:25px;
left:25px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);
padding:14px 22px;
border-radius:18px;
text-decoration:none;
color:white;
font-weight:700;
border:1px solid rgba(255,255,255,.08);
transition:.25s;
}

.back:hover{
transform:translateY(-4px);
}

h1{
text-align:center;
font-size:58px;
margin-bottom:55px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(420px,1fr));
gap:32px;
}

.btn{
display:block;
background:rgba(255,255,255,.06);
backdrop-filter:blur(24px);
padding:40px;
border-radius:32px;
text-decoration:none;
color:white;
border:1px solid rgba(255,255,255,.08);
box-shadow:0 22px 55px rgba(0,0,0,.28);
transition:.35s;
position:relative;
overflow:hidden;
}

.btn:before{
content:'';
position:absolute;
top:-80px;
right:-80px;
width:180px;
height:180px;
background:rgba(255,255,255,.05);
border-radius:50%;
}

.btn:hover{
transform:translateY(-12px) scale(1.03);
box-shadow:0 35px 70px rgba(0,0,0,.35);
}

.icon{
font-size:65px;
margin-bottom:18px;
}

.name{
font-size:34px;
font-weight:700;
margin-bottom:10px;
}

.sub{
font-size:18px;
opacity:.75;
line-height:1.8;
}

.a{border-left:8px solid #2ecc71;}
.b{border-left:8px solid #3498db;}
.c{border-left:8px solid #f39c12;}

@media(max-width:700px){
h1{
font-size:38px;
}

.name{
font-size:26px;
}
}
</style>
</head>

<body>

<a class="back" href="/zones">⬅ กลับ</a>

<div class="wrap">

<h1>🏠 โซน F</h1>

<div class="grid">

<a class="btn a" href="/zone/f/1">
<div class="icon">👨‍🌾</div>
<div class="name">คอกที่ 1 • นาย A</div>
<div class="sub">
F001 - F060<br>
ดูแลแม่พันธุ์ชุดแรก
</div>
</a>

<a class="btn b" href="/zone/f/2">
<div class="icon">👨‍🌾</div>
<div class="name">คอกที่ 2 • นาย B</div>
<div class="sub">
F061 - F162<br>
ติดตามการผสมและผลผลิต
</div>
</a>

<a class="btn c" href="/zone/f/3">
<div class="icon">👨‍🌾</div>
<div class="name">คอกที่ 3 • นาย C</div>
<div class="sub">
F163 - F212<br>
ควบคุม KPI และตรวจเชื้อ
</div>
</a>

</div>

</div>

</body>
</html>
