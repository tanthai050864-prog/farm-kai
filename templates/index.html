<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{
font-family:Segoe UI;
background:linear-gradient(135deg,#002c7a,#1e90ff);
margin:0;
padding:20px;
color:white;
}

h1{
text-align:center;
margin:30px 0;
font-size:34px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
max-width:1200px;
margin:auto;
}

.card{
background:white;
color:#002c7a;
padding:30px;
border-radius:24px;
box-shadow:0 15px 30px rgba(0,0,0,.25);
text-align:center;
text-decoration:none;
font-weight:bold;
font-size:20px;
transition:.25s;
}

.card:hover{
transform:translateY(-8px);
}

.sub{
font-size:14px;
margin-top:8px;
opacity:.8;
}
</style>
</head>
<body>

<h1>🐔 ระบบจัดการฟาร์มไก่</h1>

<div class="grid">

<a class="card" href="/register">
🐔 ฝากผสม
<div class="sub">ลงทะเบียนรับฝากผสม</div>
</a>

<a class="card" href="/manage">
📦 จัดการไก่เข้าล็อค
<div class="sub">เลือกเข้าคอกผสม</div>
</a>

<a class="card" href="/zones">
📡 ติดตามอัปเดตการผสม
<div class="sub">โซน F / K</div>
</a>

<a class="card" href="/farm">
🐓 ไก่ฟาร์ม
<div class="sub">ข้อมูลพ่อพันธุ์ / ลูกไก่</div>
</a>

<a class="card" href="/dashboard">
📊 Dashboard KPI
<div class="sub">รายงาน KPI 90 วัน</div>
</a>

<a class="card" href="/history_all">
📚 ประวัติการรับฝากผสม
<div class="sub">รับเข้า / ส่งออก</div>
</a>

</div>

</body>
</html>
