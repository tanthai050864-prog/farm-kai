<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
@import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;700&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Prompt',sans-serif;
}

body{
background:linear-gradient(135deg,#eef8f1,#dff0e3);
padding:40px;
color:#243d2e;
}

.wrap{
max-width:1500px;
margin:auto;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:35px;
}

.title{
font-size:46px;
font-weight:700;
color:#2d5a3f;
}

.back{
background:white;
padding:14px 22px;
border-radius:16px;
text-decoration:none;
color:#2d5a3f;
font-weight:700;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:25px;
}

.card{
background:white;
border-radius:28px;
padding:35px;
text-align:center;
text-decoration:none;
color:#243d2e;
box-shadow:0 18px 35px rgba(0,0,0,.07);
transition:.25s;
}

.card:hover{
transform:translateY(-8px);
}

.num{
font-size:70px;
font-weight:700;
color:#4caf50;
}

.label{
font-size:22px;
font-weight:700;
margin-top:14px;
}

.sub{
font-size:15px;
color:#666;
margin-top:8px;
}

.total{
margin-top:35px;
background:linear-gradient(145deg,#2d5a3f,#4caf50);
color:white;
padding:40px;
border-radius:30px;
text-align:center;
}

.big{
font-size:85px;
font-weight:700;
}
</style>
</head>
<body>

<div class="wrap">

<div class="top">
<div class="title">📊 Smart Farm KPI</div>
<a class="back" href="/">← กลับ</a>
</div>

<div class="grid">

<a class="card" href="/dashboard_group/zero_one">
<div class="num">{{zero_one}}</div>
<div class="label">ได้ลูก 0-1 ตัว</div>
<div class="sub">คลิกดูคอก</div>
</a>

<a class="card" href="/dashboard_group/one_three">
<div class="num">{{one_three}}</div>
<div class="label">ได้ลูก 1-3 ตัว</div>
<div class="sub">คลิกดูคอก</div>
</a>

<a class="card" href="/dashboard_group/three_five">
<div class="num">{{three_five}}</div>
<div class="label">ได้ลูก 3-5 ตัว</div>
<div class="sub">คลิกดูคอก</div>
</a>

<a class="card" href="/dashboard_group/six_up">
<div class="num">{{six_up}}</div>
<div class="label">ได้ลูก 6+ ตัว</div>
<div class="sub">คลิกดูคอก</div>
</a>

</div>

<div class="total">
<div class="big">{{born}}</div>
<div>จำนวนลูกไก่รวมทั้งหมด</div>
</div>

</div>

</body>
</html>
