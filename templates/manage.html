<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{
font-family:Segoe UI;
background:#0f1720;
color:white;
padding:30px;
margin:0;
}

h1{
text-align:center;
margin-bottom:30px;
}

.waiting{
background:#1e293b;
padding:20px;
border-radius:20px;
margin-bottom:35px;
}

.customer{
padding:16px;
background:#334155;
margin-bottom:14px;
border-radius:14px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
gap:12px;
}

.cage{
padding:16px;
border-radius:16px;
text-align:center;
font-weight:bold;
text-decoration:none;
color:white;
display:block;
}

.F{background:#16a34a;}
.K{background:#2563eb;}
.BH{background:#9333ea;}

.full{
opacity:.35;
pointer-events:none;
}
</style>
</head>
<body>

<h1>📦 จัดการไก่เข้าคอก</h1>

<div class="waiting">

<h2>รอเข้าคอก</h2>

{% for c in waiting %}
<div class="customer">

<b>{{c.customer}}</b><br>
แม่: {{c.mother}}<br>
พ่อ: {{c.father}}

<div class="grid" style="margin-top:15px;">

{% for cage,data in cages.items() %}

{% if data.customer %}
<a class="cage
{% if cage.startswith('F') %}F{% endif %}
{% if cage.startswith('K') %}K{% endif %}
{% if cage.startswith('BH') %}BH{% endif %}
full">
{{cage}}
</a>

{% else %}
<a href="/assign/{{c.id}}/{{cage}}"
class="cage
{% if cage.startswith('F') %}F{% endif %}
{% if cage.startswith('K') %}K{% endif %}
{% if cage.startswith('BH') %}BH{% endif %}">
{{cage}}
</a>
{% endif %}

{% endfor %}

</div>

</div>
{% endfor %}

</div>

</body>
</html>
