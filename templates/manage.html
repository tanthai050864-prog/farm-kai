<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{
font-family:Segoe UI;
background:#0d1f14;
padding:30px;
color:white;
margin:0;
}

h1{
text-align:center;
font-size:42px;
margin-bottom:30px;
}

.box{
max-width:1200px;
margin:auto;
}

.card{
background:rgba(255,255,255,.06);
padding:25px;
border-radius:22px;
margin-bottom:25px;
}

.wait{
background:#2e7d32;
}

select,button{
padding:14px;
border:none;
border-radius:14px;
font-size:16px;
margin-top:12px;
}

select{
width:70%;
}

button{
background:#4CAF50;
color:white;
font-weight:bold;
cursor:pointer;
width:25%;
}

.row{
margin-bottom:18px;
padding:18px;
background:rgba(255,255,255,.08);
border-radius:16px;
}
</style>
</head>
<body>

<div class="box">

<h1>🐔 จัดการไก่เข้าคอก</h1>

{% for w in waiting %}
<div class="card wait">

<div class="row">
👤 {{w.customer}} <br>
🐔 {{w.mother}} × {{w.father}}
</div>

<form method="POST" action="/assign/{{loop.index0}}">

<select name="cage" required>

{% for cage,data in cages.items() %}
{% if not data.customer %}

<option value="{{cage}}">
{{cage}}
</option>

{% endif %}
{% endfor %}

</select>

<button type="submit">
เข้าคอก
</button>

</form>

</div>
{% endfor %}

</div>

</body>
</html>
