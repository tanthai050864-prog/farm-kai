<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{
font-family:Segoe UI;
background:#eef7ef;
padding:35px;
margin:0;
}

h1{
text-align:center;
font-size:50px;
color:#183926;
margin-bottom:35px;
}

.waiting{
max-width:1300px;
margin:auto;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
gap:25px;
}

.card{
background:white;
padding:28px;
border-radius:24px;
box-shadow:0 15px 35px rgba(0,0,0,.08);
}

.name{
font-size:28px;
font-weight:bold;
color:#183926;
margin-bottom:12px;
}

.info{
line-height:1.8;
color:#555;
margin-bottom:20px;
}

select{
width:100%;
padding:18px;
border-radius:16px;
border:none;
font-size:18px;
margin-bottom:18px;
font-weight:bold;
}

.f{
background:#2ecc71;
color:white;
}

.k{
background:#3498db;
color:white;
}

.bh{
background:#9b59b6;
color:white;
}

button{
width:100%;
padding:18px;
border:none;
border-radius:16px;
background:#183926;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:.9;
}
</style>
</head>
<body>

<h1>🐔 จัดการไก่เข้าคอก</h1>

<div class="waiting">

{% for item in waiting %}
<div class="card">

<div class="name">{{item.customer}}</div>

<div class="info">
แม่พันธุ์: {{item.mother}}<br>
พ่อพันธุ์: {{item.father}}<br>
โทร: {{item.phone}}
</div>

<form action="/assign/{{loop.index0}}" method="POST">

<select name="cage" required>

<optgroup label="🟩 โซน F">
{% for c in cages if c.startswith('F') and not cages[c] %}
<option class="f" value="{{c}}">{{c}}</option>
{% endfor %}
</optgroup>

<optgroup label="🟦 โซน K">
{% for c in cages if c.startswith('K') and not cages[c] %}
<option class="k" value="{{c}}">{{c}}</option>
{% endfor %}
</optgroup>

<optgroup label="🟪 โซน BH">
{% for c in cages if c.startswith('BH') and not cages[c] %}
<option class="bh" value="{{c}}">{{c}}</option>
{% endfor %}
</optgroup>

</select>

<button type="submit">เข้าคอก</button>

</form>

</div>
{% endfor %}

</div>

</body>
</html>
