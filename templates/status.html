<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
    margin:0;
    font-family:'Segoe UI';
    background:#eef4ff;
    color:#111;
}

.wrap{
    max-width:1700px;
    margin:auto;
    padding:30px;
}

.top{
    background:white;
    border-radius:28px;
    padding:35px;
    box-shadow:0 10px 35px rgba(0,0,0,.08);
}

h1{
    font-size:58px;
    margin:0;
    color:#3164ff;
}

.info{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    margin-top:25px;
}

.info div{
    background:#f6f8fc;
    padding:22px;
    border-radius:18px;
    font-size:22px;
}

.weeks{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    margin-top:35px;
}

.week{
    padding:24px;
    border-radius:22px;
    text-align:center;
    font-size:30px;
    font-weight:bold;
    cursor:pointer;
    transition:.25s;
}

.done{background:#28c45a;color:white;}
.now{background:#3164ff;color:white;}
.wait{background:#d8e4ff;color:#234;}

.week:hover{
transform:translateY(-6px);
}

.detail{
    margin-top:35px;
    background:white;
    border-radius:30px;
    padding:45px;
    box-shadow:0 12px 35px rgba(0,0,0,.08);
}

.big{
    font-size:130px;
    font-weight:bold;
    margin:25px 0;
}

.good{color:#28c45a;}
.bad{color:#ff3d3d;}
.nowtxt{color:#3164ff;}

.note{
    font-size:28px;
    margin:20px 0;
}

.alert{
    color:#ff3d3d;
    font-weight:bold;
}

.ok{
    color:#28c45a;
    font-weight:bold;
}

.back{
position:fixed;
top:25px;
right:25px;
background:#3164ff;
color:white;
padding:18px 28px;
border-radius:18px;
text-decoration:none;
font-size:22px;
font-weight:bold;
}
</style>
</head>
<body>

<a class="back" href="javascript:history.back()">กลับ</a>

<div class="wrap">

<div class="top">
<h1>{{cage}}</h1>

<div class="info">
<div>👤 {{data.customer}}</div>
<div>📞 {{data.phone}}</div>
<div>🐔 {{data.mother}}</div>
<div>🐓 {{data.father}}</div>
</div>

<div class="weeks">
<div class="week done" onclick="showWeek(1)">1-2</div>
<div class="week done" onclick="showWeek(2)">3-4</div>
<div class="week now" onclick="showWeek(3)">5-8</div>
<div class="week wait" onclick="showWeek(4)">9-12</div>
</div>
</div>

<div class="detail" id="detail"></div>

</div>

<script>

const eggs={{data.status.get('eggs',0)}};

function showWeek(w){

let html='';

if(w==1){
html=`
<h2>สัปดาห์ 1-2 : ฉีดผสม + เก็บไข่</h2>
<div class="big good">${eggs}</div>
<div class="note">จำนวนไข่</div>
<div class="${eggs>=6?'ok':'alert'}">
${eggs>=6?'ผ่านเกณฑ์':'ต่ำกว่าเกณฑ์ ต้องตรวจแม่ไก่'}
</div>
<p>ฉีดวันที่ : {{data.status.get('inject_date','-')}}</p>
<p>จำนวนฉีด : {{data.status.get('inject_count','-')}} ครั้ง</p>
`;
}

if(w==2){
html=`
<h2>สัปดาห์ 3-4 : ตรวจจำนวนไข่</h2>
<div class="big ${eggs>=6?'good':'bad'}">${eggs}</div>
<div class="note">ไข่สะสม</div>
<p>เกณฑ์ขั้นต่ำ 6 ฟอง</p>
`;
}

if(w==3){
html=`
<h2>สัปดาห์ 5-8 : กำลังกกไข่</h2>
<div class="big nowtxt">LIVE</div>
<div class="note">ควบคุมอุณหภูมิ + ความชื้น</div>
<p>เริ่มกก : {{data.status.get('brooding','-')}}</p>
<p>อีก 12 วันเช็คเชื้อ</p>
`;
}

if(w==4){
html=`
<h2>สัปดาห์ 9-12 : ตรวจเชื้อ + เตรียมฟัก</h2>
<div class="big">🐣</div>
<p>ผลเช็ค : {{data.status.get('check_result','รอเช็ค')}}</p>
<p>{{data.status.get('note','-')}}</p>
`;
}

document.getElementById('detail').innerHTML=html;
}

showWeek(3);

</script>

</body>
</html>
