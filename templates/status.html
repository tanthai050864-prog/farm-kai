<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#1e3a8a);
min-height:100vh;
padding:50px;
color:white;
}

.wrap{
max-width:1400px;
margin:auto;
}

.top{
backdrop-filter:blur(18px);
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.12);
padding:35px;
border-radius:28px;
box-shadow:0 15px 45px rgba(0,0,0,.25);
}

h1{
font-size:56px;
font-weight:800;
letter-spacing:2px;
color:#60a5fa;
margin-bottom:35px;
}

.timeline{
display:flex;
gap:18px;
}

.step{
flex:1;
padding:24px;
border-radius:22px;
cursor:pointer;
text-align:center;
font-size:22px;
font-weight:700;
transition:.35s;
backdrop-filter:blur(10px);
}

.step:hover{
transform:translateY(-8px) scale(1.03);
}

.done{
background:linear-gradient(135deg,#22c55e,#16a34a);
box-shadow:0 10px 25px rgba(34,197,94,.35);
}

.now{
background:linear-gradient(135deg,#3b82f6,#2563eb);
box-shadow:0 10px 25px rgba(59,130,246,.45);
animation:pulse 2s infinite;
}

.wait{
background:rgba(255,255,255,.10);
color:#cbd5e1;
}

@keyframes pulse{
0%{box-shadow:0 0 0 rgba(59,130,246,.5);}
50%{box-shadow:0 0 35px rgba(59,130,246,.7);}
100%{box-shadow:0 0 0 rgba(59,130,246,.5);}
}

.detail{
margin-top:35px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);
border-radius:30px;
padding:45px;
box-shadow:0 18px 45px rgba(0,0,0,.22);
min-height:320px;
transition:.35s;
}

.title{
font-size:34px;
font-weight:800;
margin-bottom:25px;
color:#60a5fa;
}

.info{
font-size:24px;
line-height:2;
color:#f8fafc;
}

.tag{
display:inline-block;
padding:10px 20px;
border-radius:18px;
background:rgba(255,255,255,.12);
margin-top:18px;
font-size:18px;
}

</style>
</head>
<body>

<div class="wrap">

<div class="top">

<h1>{{cage}}</h1>

<div class="timeline">

<div class="step done" onclick="show(1)">
✅ สัปดาห์ 1-2
</div>

<div class="step done" onclick="show(2)">
🥚 สัปดาห์ 3-4
</div>

<div class="step now" onclick="show(3)">
🔥 สัปดาห์ 5-8
</div>

<div class="step wait" onclick="show(4)">
🧪 สัปดาห์ 9-12
</div>

<div class="step wait" onclick="show(5)">
🐣 ครบกำหนด
</div>

</div>

</div>

<div class="detail" id="detail">

<div class="title">💉 สัปดาห์ 1-2</div>

<div class="info">
ฉีดผสมเรียบร้อย<br>
วันที่ฉีด: {{data.status.get('inject_date','-')}}<br>
จำนวนครั้ง: {{data.status.get('inject_count','-')}} ครั้ง
</div>

<div class="tag">เริ่มต้นวงจรการฟัก</div>

</div>

</div>

<script>

function show(step){

let d=document.getElementById("detail");

if(step==1){
d.innerHTML=`
<div class="title">💉 สัปดาห์ 1-2</div>
<div class="info">
ฉีดผสมเรียบร้อย<br>
วันที่ฉีด: {{data.status.get('inject_date','-')}}<br>
จำนวนครั้ง: {{data.status.get('inject_count','-')}} ครั้ง
</div>
<div class="tag">เริ่มต้นวงจรการฟัก</div>
`;
}

if(step==2){
d.innerHTML=`
<div class="title">🥚 สัปดาห์ 3-4</div>
<div class="info">
ได้ไข่ทั้งหมด {{data.status.get('eggs','0')}} ฟอง<br>
คัดสมบูรณ์เรียบร้อย
</div>
<div class="tag">ระยะสร้างผลผลิต</div>
`;
}

if(step==3){
d.innerHTML=`
<div class="title">🔥 สัปดาห์ 5-8</div>
<div class="info">
กำลังกกไข่<br>
ควบคุมอุณหภูมิ / ความชื้น<br>
อีก 12 วันเข้าสู่เช็คเชื้อ
</div>
<div class="tag">สถานะปัจจุบัน</div>
`;
}

if(step==4){
d.innerHTML=`
<div class="title">🧪 สัปดาห์ 9-12</div>
<div class="info">
ผลเชื้อ: {{data.status.get('check_result','รอตรวจ')}}<br>
เตรียมเข้าสู่การฟัก
</div>
<div class="tag">ตรวจคุณภาพ</div>
`;
}

if(step==5){
d.innerHTML=`
<div class="title">🐣 ครบกำหนด</div>
<div class="info">
ลูกไก่เกิดแล้ว<br>
เข้าสู่ระบบอนุบาล
</div>
<div class="tag">เสร็จสมบูรณ์</div>
`;
}

}

</script>

</body>
</html>
