<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
margin:0;
font-family:Segoe UI;
background:#f5f7fb;
text-align:center;
}

.container{
max-width:1000px;
margin:auto;
padding:30px;
}

h1{
color:#3f51b5;
}

.wheel{
width:380px;
height:380px;
border-radius:50%;
margin:40px auto;
position:relative;
background:conic-gradient(
#4caf50 0% 20%,
#ff9800 20% 40%,
#2196f3 40% 60%,
#9c27b0 60% 80%,
#f44336 80% 100%
);
box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.center{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:170px;
height:170px;
background:white;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:24px;
font-weight:bold;
color:#3f51b5;
}

.dot{
position:absolute;
width:70px;
height:70px;
border-radius:50%;
background:white;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
font-size:14px;
font-weight:bold;
box-shadow:0 4px 10px rgba(0,0,0,.15);
transition:.3s;
}

.dot:hover{
transform:scale(1.15);
}

.d1{top:20px;left:155px;}
.d2{top:95px;right:15px;}
.d3{bottom:95px;right:15px;}
.d4{bottom:20px;left:155px;}
.d5{bottom:95px;left:15px;}

.card{
background:white;
padding:25px;
border-radius:25px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
margin-top:30px;
text-align:left;
}

.back{
display:inline-block;
margin-bottom:20px;
text-decoration:none;
font-weight:bold;
color:#3f51b5;
}
</style>
</head>
<body>

<div class="container">

<a class="back" href="javascript:history.back()">⬅ กลับ</a>

<h1>{{cage}}</h1>

<div class="wheel">

<div class="center" id="title">สัปดาห์ 1-2</div>

<div class="dot d1" onclick="showStep(1)">1-2</div>
<div class="dot d2" onclick="showStep(2)">3-4</div>
<div class="dot d3" onclick="showStep(3)">5-8</div>
<div class="dot d4" onclick="showStep(4)">9-12</div>
<div class="dot d5" onclick="showStep(5)">ครบ</div>

</div>

<div class="card" id="detail">
💉 ฉีดผสมเรียบร้อย
</div>

<div class="card">
👤 {{data.customer}}<br>
📞 {{data.phone}}<br>
🥚 จำนวนไข่: {{data.status.get('eggs','0')}}<br>
🕒 อัปเดตล่าสุด: {{data.status.get('updated_at','ยังไม่เคยอัปเดต')}}
</div>

</div>

<script>
function showStep(step){

let title=document.getElementById("title");
let detail=document.getElementById("detail");

if(step==1){
title.innerHTML="สัปดาห์ 1-2";
detail.innerHTML="💉 ฉีดผสมเรียบร้อย";
}

if(step==2){
title.innerHTML="สัปดาห์ 3-4";
detail.innerHTML="🥚 ได้ไข่และตรวจสมบูรณ์";
}

if(step==3){
title.innerHTML="สัปดาห์ 5-8";
detail.innerHTML="🔥 กำลังกกไข่ ติดตามอุณหภูมิ";
}

if(step==4){
title.innerHTML="สัปดาห์ 9-12";
detail.innerHTML="🧪 เช็คเชื้อ พร้อมฟัก";
}

if(step==5){
title.innerHTML="ครบกำหนด";
detail.innerHTML="🐣 เกิดแล้ว เข้าอนุบาลไก่";
}

}
</script>

</body>
</html>
