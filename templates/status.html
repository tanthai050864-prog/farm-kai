<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{
margin:0;
font-family:Segoe UI;
background:#f8fafc;
padding:30px;
}

.wrap{
max-width:1300px;
margin:auto;
}

.top{
background:white;
padding:25px;
border-radius:24px;
box-shadow:0 10px 30px rgba(0,0,0,.06);
}

h1{
margin:0;
color:#2563eb;
}

.timeline{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:35px;
gap:15px;
}

.step{
flex:1;
padding:18px;
text-align:center;
background:#e5e7eb;
border-radius:18px;
cursor:pointer;
font-weight:bold;
transition:.25s;
}

.step:hover{
transform:translateY(-5px);
}

.done{
background:#22c55e;
color:white;
}

.now{
background:#2563eb;
color:white;
}

.wait{
background:#cbd5e1;
}

.detail{
margin-top:30px;
background:white;
padding:30px;
border-radius:24px;
box-shadow:0 10px 30px rgba(0,0,0,.06);
font-size:20px;
line-height:2;
}

.back{
display:inline-block;
margin-bottom:20px;
text-decoration:none;
font-weight:bold;
color:#2563eb;
}
</style>
</head>
<body>

<div class="wrap">

<a class="back" href="javascript:history.back()">⬅ กลับ</a>

<div class="top">

<h1>{{cage}}</h1>

<div class="timeline">

<div class="step done" onclick="show(1)">✅ สัปดาห์ 1-2</div>
<div class="step done" onclick="show(2)">✅ สัปดาห์ 3-4</div>
<div class="step now" onclick="show(3)">🔵 สัปดาห์ 5-8</div>
<div class="step wait" onclick="show(4)">⏳ สัปดาห์ 9-12</div>
<div class="step wait" onclick="show(5)">🐣 ครบกำหนด</div>

</div>

</div>

<div class="detail" id="detail">

<b>🔥 สัปดาห์ 5-8</b><br>
กำลังกกไข่<br>
ควบคุมอุณหภูมิและติดตามความชื้น<br>
อีก 12 วันเข้าสู่การเช็คเชื้อ

</div>

</div>

<script>

function show(step){

let d=document.getElementById("detail");

if(step==1){
d.innerHTML=`
<b>💉 สัปดาห์ 1-2</b><br>
ฉีดผสมเรียบร้อย<br>
วันที่ฉีด: {{data.status.get('inject_date','-')}}<br>
จำนวนครั้ง: {{data.status.get('inject_count','-')}} ครั้ง
`;
}

if(step==2){
d.innerHTML=`
<b>🥚 สัปดาห์ 3-4</b><br>
ได้ไข่ทั้งหมด: {{data.status.get('eggs','0')}} ฟอง<br>
คัดสมบูรณ์แล้ว
`;
}

if(step==3){
d.innerHTML=`
<b>🔥 สัปดาห์ 5-8</b><br>
กำลังกกไข่<br>
ติดตามอุณหภูมิ / ความชื้น<br>
อีก 12 วันเข้าสู่เช็คเชื้อ
`;
}

if(step==4){
d.innerHTML=`
<b>🧪 สัปดาห์ 9-12</b><br>
เช็คเชื้อ<br>
ผลล่าสุด: {{data.status.get('check_result','รอตรวจ')}}
`;
}

if(step==5){
d.innerHTML=`
<b>🐣 ครบกำหนด</b><br>
ลูกไก่เกิดแล้ว<br>
เข้าสู่ระบบอนุบาล
`;
}

}

</script>

</body>
</html>
