<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
@import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;700&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Prompt',sans-serif;
}

body{
background:#eef7ef;
padding:40px;
color:#234d30;
}

.wrap{
max-width:1450px;
margin:auto;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:35px;
}

.title{
font-size:58px;
font-weight:700;
color:white;
background:#2f6f3b;
padding:20px 35px;
border-radius:22px;
}

.actions{
display:flex;
gap:14px;
}

.btn{
padding:16px 24px;
border-radius:16px;
text-decoration:none;
font-weight:700;
color:white;
}

.back{background:#555;}
.history{background:#3498db;}
.update{background:#4CAF50;}
.finish{background:#8b5e3c;}

.panel{
display:grid;
grid-template-columns:320px 1fr;
gap:30px;
}

.left{
background:linear-gradient(135deg,#2f6f3b,#4CAF50);
color:white;
padding:35px;
border-radius:28px;
}

.big{
font-size:120px;
font-weight:700;
}

.eggs{
font-size:30px;
}

.right{
background:white;
padding:35px;
border-radius:28px;
box-shadow:0 15px 40px rgba(0,0,0,.08);
}

.detail{
font-size:24px;
line-height:2;
}

.label{
font-weight:700;
color:#4CAF50;
}

.footer{
margin-top:25px;
font-size:20px;
opacity:.75;
}
</style>
</head>
<body>

<div class="wrap">

<div class="top">

<div class="title">
🐔 Smart Farm • {{cage}}
</div>

<div class="actions">
<a class="btn back" href="/zones">กลับ</a>
<a class="btn history" href="/history/{{cage}}">ประวัติ</a>
<a class="btn update" href="/update/{{cage}}">อัปเดต</a>
<a class="btn finish" href="/finish/{{cage}}">จบงาน</a>
</div>

</div>

<div class="panel">

<div class="left">
<div class="big">{{data.eggs}}</div>
<div class="eggs">ไข่สะสม</div>
</div>

<div class="right">

<div class="detail">

<div><span class="label">ลูกค้า:</span> {{data.customer or "-"}}</div>

<div><span class="label">แม่พันธุ์:</span> {{data.mother or "-"}}</div>

<div><span class="label">พ่อพันธุ์:</span> {{data.father or "-"}}</div>

<div><span class="label">โทร:</span> {{data.phone or "-"}}</div>

<div><span class="label">ส่งออก:</span> {{data.finish_date or "ยังไม่จบงาน"}}</div>

</div>

<div class="footer">
ระบบ Smart Farm พร้อมใช้งาน
</div>

</div>

</div>

</div>

</body>
</html>
