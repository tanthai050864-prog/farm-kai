<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{
margin:0;
font-family:Inter,Segoe UI;
background:#0f172a;
color:white;
}

.wrap{
max-width:1300px;
margin:auto;
padding:40px;
display:grid;
grid-template-columns:500px 1fr;
gap:40px;
}

.panel{
background:#1e293b;
border-radius:30px;
padding:35px;
box-shadow:0 20px 40px rgba(0,0,0,.35);
}

.ring{
width:360px;
height:360px;
border-radius:50%;
margin:auto;
background:
conic-gradient(
#06b6d4 0% 20%,
#10b981 20% 40%,
#f59e0b 40% 60%,
#8b5cf6 60% 80%,
#ef4444 80% 100%);
display:flex;
align-items:center;
justify-content:center;
position:relative;
cursor:pointer;
}

.inner{
width:230px;
height:230px;
background:#0f172a;
border-radius:50%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

.day{
font-size:60px;
font-weight:800;
}

.phase{
color:#38bdf8;
font-size:20px;
}

.item{
padding:22px;
margin:18px 0;
border-radius:20px;
background:#334155;
cursor:pointer;
transition:.25s;
}

.item:hover{
transform:translateX(10px);
background:#475569;
}

.active{
background:#06b6d4;
color:black;
font-weight:bold;
}

h1{
margin:0 0 25px;
font-size:34px;
}

.info{
line-height:2;
font-size:18px;
}

.back{
position:fixed;
top:20px;
left:20px;
background:white;
color:black;
padding:12px 18px;
border-radius:15px;
text-decoration:none;
font-weight:bold;
}
</style>
</head>
<body>

<a class="back" href="javascript:history.back()">⬅ กลับ</a>

<div class="wrap">

<div class="panel">

<div class="ring">
<div class="inner">
<div class="day" id="dayNum">45</div>
<div class="phase" id="phaseName">กกไข่</div>
</div>
</div>

</div>

<div class="panel">

<h1>{{cage}}</h1>

<div class="item active" onclick="show(1)">💉 Week 1-2 ฉีดผสม</div>
<div class="item" onclick="show(2)">🥚 Week 3-4 ได้ไข่</div>
<div class="item" onclick="show(3)">🔥 Week 5-8 กกไข่</div>
<div class="item" onclick="show(4)">🧪 Week 9-12 เช็คเชื้อ</div>
<div class="item" onclick="show(5)">🐣 ครบกำหนด อนุบาล</div>

<div class="panel" style="margin-top:25px">

<div class="info" id="detail">
กำลังควบคุมอุณหภูมิและติดตามการพัฒนาไข่
</div>

<hr>

👤 {{data.customer}}<br>
📞 {{data.phone}}<br>
🥚 {{data.status.get('eggs','0')}} ฟอง<br>
🕒 {{data.status.get('updated_at','ยังไม่เคยอัปเดต')}}

</div>

</div>

</div>

<script>

function clearAll(){
document.querySelectorAll('.item')
.forEach(x=>x.classList.remove('active'))
}

function show(step){

clearAll()

let items=document.querySelectorAll('.item')
items[step-1].classList.add('active')

let d=document.getElementById('detail')
let day=document.getElementById('dayNum')
let phase=document.getElementById('phaseName')

if(step==1){
day.innerHTML="10"
phase.innerHTML="ฉีดผสม"
d.innerHTML="อยู่ช่วงกระตุ้นผสม";
}

if(step==2){
day.innerHTML="24"
phase.innerHTML="ได้ไข่"
d.innerHTML="เริ่มได้ไข่ ตรวจสมบูรณ์";
}

if(step==3){
day.innerHTML="45"
phase.innerHTML="กกไข่"
d.innerHTML="กำลังควบคุมอุณหภูมิและติดตามการพัฒนาไข่";
}

if(step==4){
day.innerHTML="72"
phase.innerHTML="เช็คเชื้อ"
d.innerHTML="ตรวจเชื้อพร้อมเข้าสู่ระยะฟัก";
}

if(step==5){
day.innerHTML="90"
phase.innerHTML="อนุบาล"
d.innerHTML="ลูกไก่เกิดแล้ว พร้อมอนุบาล";
}

}

</script>

</body>
</html>
