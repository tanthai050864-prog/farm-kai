<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{
font-family:Segoe UI;
background:#002c7a;
padding:20px;
margin:0;
color:white;
}

.back{
position:fixed;
top:15px;
left:15px;
background:white;
color:#002c7a;
padding:12px 18px;
border-radius:14px;
text-decoration:none;
font-weight:bold;
}

.container{
max-width:700px;
margin:80px auto;
background:white;
color:#002c7a;
padding:35px;
border-radius:24px;
box-shadow:0 15px 30px rgba(0,0,0,.25);
}

input,textarea{
width:100%;
padding:14px;
margin:10px 0;
border-radius:14px;
border:1px solid #ccc;
font-size:16px;
box-sizing:border-box;
}

button{
width:100%;
padding:16px;
background:#1e90ff;
color:white;
border:none;
border-radius:16px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}
</style>
</head>
<body>

<a class="back" href="/zones">⬅ กลับ</a>

<div class="container">

<h2>📡 อัปเดต {{cage}}</h2>

<form method="POST">

<label>📅 วันที่ฉีดผสม</label>
<input name="inject_date">

<label>💉 ครั้งที่ฉีดผสม</label>
<input name="inject_count">

<label>🥚 จำนวนไข่</label>
<input name="eggs" type="number">

<label>🐔 วันที่ไก่กกไข่</label>
<input name="brooding">

<label>🧪 สถานะผลการเช็คเชื้อ</label>
<input name="check_result">

<label>🐣 วันที่ไก่เกิด</label>
<input name="born">

<label>🐣 จำนวนลูกไก่ที่เกิด</label>
<input name="born_count" type="number">

<label>📝 หมายเหตุเพิ่มเติม</label>
<textarea name="note"></textarea>

<button type="submit">💾 บันทึกอัปเดต</button>

</form>

</div>

</body>
</html>
