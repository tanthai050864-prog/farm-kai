<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{
font-family:Segoe UI;
background:#eef7ef;
padding:30px;
margin:0;
}

.wrap{
max-width:1200px;
margin:auto;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.title{
font-size:40px;
font-weight:bold;
color:#234d30;
}

.back{
background:white;
padding:12px 20px;
border-radius:14px;
text-decoration:none;
font-weight:bold;
color:#234d30;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:20px;
}

.card{
background:white;
padding:25px;
border-radius:24px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
text-decoration:none;
color:#234d30;
}

.cage{
font-size:38px;
font-weight:bold;
color:#4CAF50;
}

.info{
margin-top:15px;
font-size:20px;
line-height:1.8;
}
</style>
</head>
<body>

<div class="wrap">

<div class="top">
<div class="title">📊 รายการคอก</div>
<a class="back" href="/dashboard">← กลับ</a>
</div>

<div class="grid">

{% for c in cages %}

<a class="card" href="/status/{{c.cage}}">

<div class="cage">{{c.cage}}</div>

<div class="info">
👤 {{c.customer or "-"}}<br>
🐣 {{c.birth}} ตัว
</div>

</a>

{% endfor %}

</div>

</div>

</body>
</html>
