<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
@import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;700&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Prompt',sans-serif;
}

body{
background:
linear-gradient(rgba(20,35,20,.72),rgba(15,25,15,.8)),
url('https://images.unsplash.com/photo-1548550023-2bdb3c5beed7?auto=format&fit=crop&w=1800&q=80');
background-size:cover;
background-attachment:fixed;
min-height:100vh;
padding:30px;
color:white;
}

.back{
position:fixed;
top:20px;
left:20px;
background:rgba(255,255,255,.12);
backdrop-filter:blur(14px);
padding:14px 22px;
border-radius:18px;
text-decoration:none;
color:white;
font-weight:700;
box-shadow:0 10px 25px rgba(0,0,0,.25);
transition:.25s;
}

.back:hover{
transform:translateY(-4px);
background:rgba(255,255,255,.2);
}

.container{
max-width:1600px;
margin:auto;
padding-top:80px;
}

h1{
text-align:center;
font-size:52px;
margin-bottom:35px;
font-weight:700;
text-shadow:0 8px 18px rgba(0,0,0,.35);
}

.table-wrap{
background:rgba(255,255,255,.12);
backdrop-filter:blur(18px);
border-radius:28px;
overflow:hidden;
box-shadow:0 20px 50px rgba(0,0,0,.25);
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:rgba(67,160,71,.9);
padding:20px;
font-size:18px;
font-weight:700;
}

td{
padding:18px;
text-align:center;
background:rgba(255,255,255,.08);
border-bottom:1px solid rgba(255,255,255,.08);
font-size:16px;
}

tr:hover td{
background:rgba(255,255,255,.14);
}

.badge{
background:#43a047;
padding:8px 16px;
border-radius:14px;
font-weight:700;
display:inline-block;
}

.empty{
text-align:center;
padding:70px;
font-size:24px;
font-weight:600;
color:#ddd;
}

@media(max-width:900px){
h1{font-size:34px;}
th,td{font-size:14px;padding:12px;}
}
</style>
</head>
<body>

<div class="wrap">

<div class="top">
<div class="title">📥 ประวัติรับเข้า Smart Farm</div>
<a class="back" href="/history_all">← กลับ</a>
</div>

<div class="tablebox">

{% if customers %}

<table>

<tr>
<th>วันที่รับเข้า</th>
<th>ลูกค้า</th>
<th>แม่พันธุ์</th>
<th>พ่อพันธุ์</th>
<th>เบอร์โทร</th>
</tr>

{% for c in customers %}
<tr>
<td>{{c.date}}</td>
<td>{{c.customer}}</td>
<td>{{c.mother}}</td>
<td>{{c.father}}</td>
<td>{{c.phone}}</td>
</tr>
{% endfor %}

</table>

{% else %}

<div class="empty">
ไม่มีข้อมูลรับเข้า
</div>

{% endif %}

</div>

</div>

</body>
</html>
