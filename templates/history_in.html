<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{
font-family:Segoe UI;
background:#002c7a;
padding:20px;
margin:0;
color:white;
}

.back{
position:fixed;
top:15px;
left:15px;
background:white;
color:#002c7a;
padding:12px 18px;
border-radius:14px;
text-decoration:none;
font-weight:bold;
}

h1{
text-align:center;
margin:70px 0 30px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
color:#002c7a;
border-radius:20px;
overflow:hidden;
}

th,td{
padding:14px;
border:1px solid #ddd;
text-align:center;
}

th{
background:#1e90ff;
color:white;
}
</style>
</head>
<body>

<a class="back" href="/history_all">⬅ กลับ</a>

<h1>📥 ประวัติรับเข้า</h1>

<table>
<tr>
<th>วันที่รับเข้า</th>
<th>ชื่อลูกค้า</th>
<th>แม่พันธุ์</th>
<th>พ่อพันธุ์</th>
<th>เบอร์โทร</th>
</tr>

{% for c in customers %}
<tr>
<td>{{c.date}}</td>
<td>{{c.customer}}</td>
<td>{{c.mother}}</td>
<td>{{c.father}}</td>
<td>{{c.phone}}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
