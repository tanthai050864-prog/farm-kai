<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
@import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;700&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Prompt',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:
linear-gradient(rgba(5,25,55,.75),rgba(8,30,60,.85)),
url("https://images.unsplash.com/photo-1548550023-2bdb3c5beed7?auto=format&fit=crop&w=1600&q=80");
background-size:cover;
background-position:center;
overflow:hidden;
}

.glow{
position:absolute;
width:500px;
height:500px;
border-radius:50%;
background:rgba(30,144,255,.18);
filter:blur(100px);
animation:move 8s infinite alternate ease-in-out;
}

.glow:nth-child(1){
top:-120px;
left:-120px;
}

.glow:nth-child(2){
bottom:-120px;
right:-120px;
}

@keyframes move{
to{
transform:translate(80px,60px);
}
}

.card{
position:relative;
z-index:2;
width:430px;
padding:55px 40px;
border-radius:30px;
background:rgba(255,255,255,.12);
backdrop-filter:blur(22px);
box-shadow:0 25px 60px rgba(0,0,0,.35);
border:1px solid rgba(255,255,255,.15);
color:white;
text-align:center;
}

.logo{
font-size:62px;
margin-bottom:12px;
}

h1{
font-size:34px;
margin-bottom:8px;
}

.sub{
opacity:.85;
font-size:15px;
margin-bottom:35px;
}

.input{
width:100%;
padding:18px;
margin:12px 0;
border:none;
border-radius:18px;
background:rgba(255,255,255,.15);
color:white;
font-size:16px;
outline:none;
}

.input::placeholder{
color:rgba(255,255,255,.7);
}

button{
width:100%;
padding:18px;
margin-top:20px;
border:none;
border-radius:18px;
background:linear-gradient(135deg,#00c853,#00e676);
color:#003b18;
font-size:18px;
font-weight:700;
cursor:pointer;
transition:.25s;
box-shadow:0 12px 30px rgba(0,255,128,.25);
}

button:hover{
transform:translateY(-4px);
}

.info{
margin-top:25px;
font-size:14px;
opacity:.75;
}

@media(max-width:600px){
.card{
width:92%;
padding:40px 25px;
}
}
</style>
</head>
<body>

<div class="glow"></div>
<div class="glow"></div>

<div class="card">

<div class="logo">🐔</div>

<h1>Smart Farm Login</h1>
<div class="sub">ระบบบริหารจัดการฟาร์มอัจฉริยะ</div>

<form method="POST">

<input class="input" name="username" placeholder="👤 Username" required>

<input class="input" type="password" name="password" placeholder="🔒 Password" required>

<button>เข้าสู่ระบบ</button>

</form>

<div class="info">
ค่าเริ่มต้น : admin / 1234
</div>

</div>

</body>
</html>
