<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{
font-family:Segoe UI;
background:linear-gradient(135deg,#08130d,#183926);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
color:white;
}

.box{
background:rgba(255,255,255,.08);
padding:50px;
border-radius:28px;
width:380px;
text-align:center;
backdrop-filter:blur(18px);
}

h1{
font-size:42px;
margin-bottom:25px;
}

input{
width:100%;
padding:18px;
border:none;
border-radius:16px;
margin-bottom:20px;
font-size:18px;
}

button{
width:100%;
padding:18px;
border:none;
border-radius:16px;
background:#4CAF50;
color:white;
font-size:20px;
font-weight:bold;
cursor:pointer;
}
</style>
</head>
<body>

<div class="box">

<h1>🔒 Smart Farm</h1>

<form method="POST">
<input type="password" name="password" placeholder="กรอกรหัส FW100" required>
<button type="submit">เข้าสู่ระบบ</button>
</form>

</div>

</body>
</html>
