<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI;
}

body{
background:linear-gradient(135deg,#08130d,#183926);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
color:white;
}

.box{
background:rgba(255,255,255,.08);
padding:50px;
border-radius:28px;
width:420px;
text-align:center;
backdrop-filter:blur(18px);
box-shadow:0 20px 40px rgba(0,0,0,.35);
}

h1{
font-size:42px;
margin-bottom:30px;
}

input,
button{
width:100%;
height:58px;
border:none;
border-radius:16px;
font-size:18px;
margin-bottom:18px;
box-sizing:border-box;
}

input{
padding:0 18px;
background:white;
outline:none;
}

button{
background:#4CAF50;
color:white;
font-size:20px;
font-weight:bold;
cursor:pointer;
transition:.25s;
}

button:hover{
background:#43a047;
transform:translateY(-3px);
}
</style>
</head>
<body>

<div class="box">

<h1>🔒 Smart Farm</h1>

<form method="POST">
<input type="password" name="password" placeholder="กรอกรหัส FW100" required>
<button type="submit">เข้าสู่ระบบ</button>
</form>

</div>

</body>
</html>
