<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
body{
margin:0;
font-family:Segoe UI;
background:linear-gradient(135deg,#0b3d91,#1e90ff);
color:white;
text-align:center;
padding:60px;
}

/* 🐔 Title */
.title{
font-size:42px;
margin-bottom:40px;
text-shadow:0 6px 18px rgba(0,0,0,.3);
}

/* 🔘 menu */
.menu{
display:flex;
flex-direction:column;
gap:20px;
max-width:400px;
margin:auto;
}

.btn{
background:white;
color:#0b3d91;
padding:18px;
border-radius:20px;
font-size:20px;
font-weight:bold;
text-decoration:none;
box-shadow:0 10px 25px rgba(0,0,0,.25);
transition:.2s;
}

.btn:hover{
transform:scale(1.05);
background:#f0f6ff;
}

/* 📱 mobile */
@media (max-width:600px){
.title{font-size:28px;}
}
</style>

</head>

<body>

<h1 class="title">🐔 ไก่ฟาร์ม</h1>

</div>

</body>
</html>
