<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{
font-family:Segoe UI;
background:linear-gradient(135deg,#08130d,#183926);
padding:30px;
color:white;
margin:0;
}

.back{
position:fixed;
top:20px;
left:20px;
background:white;
color:#183926;
padding:12px 18px;
border-radius:14px;
text-decoration:none;
font-weight:bold;
}

.card{
max-width:1100px;
margin:90px auto;
background:rgba(255,255,255,.08);
backdrop-filter:blur(18px);
padding:50px;
border-radius:28px;
box-shadow:0 20px 40px rgba(0,0,0,.3);
}

h1{
font-size:54px;
margin-bottom:30px;
color:white;
}

.big{
font-size:100px;
font-weight:700;
color:#7CFF9F;
}

.info{
font-size:22px;
line-height:2;
margin-top:25px;
}

.btns{
margin-top:40px;
display:flex;
gap:20px;
flex-wrap:wrap;
}

.btn{
padding:18px 30px;
border-radius:18px;
text-decoration:none;
font-weight:bold;
font-size:18px;
color:white;
}

.update{background:#3498db;}
.history{background:#9b59b6;}
.finish{background:#e74c3c;}
</style>
</head>

<body>

<a class="back" href="/zones">⬅ กลับ</a>

<div class="card">

<h1>{{ cage }}</h1>

<div class="big">{{ data.eggs }}</div>

<div class="info">
👤 ลูกค้า: {{ data.customer or "-" }}<br>
🐔 แม่พันธุ์: {{ data.mother or "-" }}<br>
🦅 พ่อพันธุ์: {{ data.father or "-" }}<br>
📞 โทร: {{ data.phone or "-" }}<br>
📅 ส่งออก: {{ data.finish_date or "ยังไม่จบงาน" }}
</div>

<div class="btns">
<a class="btn update" href="/update/{{cage}}">อัปเดต</a>
<a class="btn history" href="/history/{{cage}}">ประวัติ</a>
<a class="btn finish" href="/finish/{{cage}}">จบงาน</a>
</div>

</div>

</body>
</html>
