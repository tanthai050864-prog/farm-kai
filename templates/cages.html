<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
@import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;700&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Prompt',sans-serif;
}

body{
background:
radial-gradient(circle at top left,#1d4b32,#0b1f15 35%),
linear-gradient(135deg,#08130d,#102218,#183926);
min-height:100vh;
padding:35px;
color:white;
}

.back{
position:fixed;
top:25px;
left:25px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);
padding:14px 22px;
border-radius:18px;
color:white;
text-decoration:none;
font-weight:700;
border:1px solid rgba(255,255,255,.08);
transition:.25s;
z-index:999;
}

.back:hover{
transform:translateY(-4px);
}

h1{
text-align:center;
font-size:58px;
margin-bottom:45px;
font-weight:700;
letter-spacing:2px;
text-shadow:0 8px 30px rgba(0,0,0,.35);
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:28px;
max-width:1800px;
margin:auto;
}

.card{
background:rgba(255,255,255,.06);
backdrop-filter:blur(18px);
border-radius:28px;
padding:28px;
border:1px solid rgba(255,255,255,.08);
box-shadow:0 20px 45px rgba(0,0,0,.28);
transition:.35s;
position:relative;
overflow:hidden;
}

.card:before{
content:'';
position:absolute;
top:-60px;
right:-60px;
width:160px;
height:160px;
background:rgba(255,255,255,.03);
border-radius:50%;
}

.card:hover{
transform:translateY(-10px);
box-shadow:0 30px 60px rgba(0,0,0,.35);
}

.cage{
font-size:48px;
font-weight:700;
color:#ffffff;
margin-bottom:18px;
}

.info{
font-size:17px;
line-height:1.8;
opacity:.92;
margin-bottom:18px;
}

.empty{
color:#7fffc2;
font-weight:600;
font-size:18px;
margin-top:20px;
}

.status{
display:inline-block;
padding:8px 16px;
border-radius:30px;
font-size:14px;
font-weight:700;
margin-bottom:18px;
}

.busy{
background:#ff5f7a33;
color:#ff8ea1;
}

.free{
background:#2ecc7133;
color:#ffffff;
}

.btns{
display:flex;
gap:12px;
margin-top:20px;
flex-wrap:wrap;
}

.btn{
flex:1;
text-align:center;
padding:14px;
border-radius:16px;
text-decoration:none;
font-weight:700;
transition:.25s;
min-width:100px;
}

.btn:hover{
transform:translateY(-4px);
}

.blue{
background:#3498db;
color:white;
}

.green{
background:#2ecc71;
color:white;
}

.red{
background:#ff5f7a;
color:white;
}

@media(max-width:700px){

h1{
font-size:36px;
}

.cage{
font-size:34px;
}

.grid{
grid-template-columns:1fr;
}

}
</style>
</head>

<body>

<a class="back" href="/zones">⬅ กลับ</a>

<h1>{{title}}</h1>

<div class="grid">

{% for cage,data in groups[title].items() %}

<div class="card">

<div class="cage">{{cage}}</div>

{% if data %}

<div class="status busy">● มีข้อมูล</div>

<div class="info">
👤 {{data.customer}}<br>
🐔 {{data.mother}}<br>
🦅 {{data.father}}
</div>

<div class="btns">
<a class="btn blue" href="/status/{{cage}}">สถานะ</a>
<a class="btn green" href="/update/{{cage}}">อัปเดต</a>
<a class="btn red" href="/finish/{{cage}}">จบงาน</a>
</div>

{% else %}

<div class="status free">● ล็อคว่าง</div>
<div class="empty">พร้อมรับฝากผสม</div>

{% endif %}

</div>

{% endfor %}

</div>

</body>
</html>
