<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{
font-family:Segoe UI;
background:linear-gradient(135deg,#08130d,#183926);
padding:30px;
margin:0;
color:white;
}

h1{
text-align:center;
font-size:56px;
margin-bottom:40px;
}

.back{
position:fixed;
top:20px;
left:20px;
background:white;
color:#183926;
padding:14px 20px;
border-radius:14px;
text-decoration:none;
font-weight:bold;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:25px;
max-width:1700px;
margin:auto;
}

.card{
background:rgba(255,255,255,.08);
backdrop-filter:blur(18px);
border-radius:28px;
padding:28px;
box-shadow:0 15px 35px rgba(0,0,0,.25);
}

.name{
font-size:52px;
font-weight:700;
color:white;
margin-bottom:20px;
}

.status{
font-size:22px;
margin-bottom:18px;
}

.empty{
color:#7CFF9F;
}

.busy{
color:#ff7272;
}

.info{
font-size:18px;
line-height:1.8;
margin-bottom:20px;
}

.btns{
display:flex;
gap:14px;
flex-wrap:wrap;
}

.btn{
padding:14px 20px;
border-radius:14px;
text-decoration:none;
font-weight:bold;
color:white;
}

.view{background:#3498db;}
.update{background:#4CAF50;}
.finish{background:#8b5e3c;}
</style>
</head>
<body>

<a class="back" href="/zones">⬅ กลับ</a>

<h1>{{title}}</h1>

<div class="grid">

{% for cage in cages %}

<div class="card">

<div class="name">{{cage.cage}}</div>

{% if cage.customer %}
<div class="status busy">● มีข้อมูล</div>

<div class="info">
👤 {{cage.customer}}<br>
🐔 {{cage.mother}}<br>
🦅 {{cage.father}}
</div>

<div class="btns">
<a class="btn view" href="/status/{{cage.cage}}">สถานะ</a>
<a class="btn update" href="/update/{{cage.cage}}">อัปเดต</a>
<a class="btn finish" href="/finish/{{cage.cage}}">จบงาน</a>
</div>

{% else %}
<div class="status empty">● ล็อคว่าง</div>
{% endif %}

</div>

{% endfor %}

</div>

</body>
</html>
