<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
@import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;700&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Prompt',sans-serif;
}

body{
background:linear-gradient(135deg,#071c34,#0d3b66,#1b6ca8);
min-height:100vh;
padding:35px;
color:white;
}

.back{
position:fixed;
top:20px;
left:20px;
background:white;
color:#0d3b66;
padding:14px 22px;
border-radius:16px;
text-decoration:none;
font-weight:700;
box-shadow:0 8px 20px rgba(0,0,0,.25);
z-index:999;
}

h1{
text-align:center;
font-size:42px;
margin-bottom:40px;
font-weight:700;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:25px;
max-width:1800px;
margin:auto;
}

.card{
background:rgba(255,255,255,.12);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.15);
padding:28px;
border-radius:28px;
box-shadow:0 18px 40px rgba(0,0,0,.25);
transition:.25s;
}

.card:hover{
transform:translateY(-6px);
}

.cage{
font-size:34px;
font-weight:700;
margin-bottom:14px;
color:#8ed8ff;
}

.empty{
font-size:18px;
opacity:.8;
margin:20px 0;
}

.name{
font-size:22px;
font-weight:600;
margin-bottom:8px;
}

.alert{
margin:12px 0;
padding:14px;
background:#ffd966;
color:#333;
border-radius:14px;
font-weight:700;
}

.btns{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
margin-top:18px;
}

.btn{
text-decoration:none;
padding:16px;
border-radius:16px;
font-weight:700;
text-align:center;
color:white;
transition:.25s;
}

.btn:hover{
transform:scale(1.05);
}

.status{background:#1e90ff;}
.update{background:#17c964;}
.finish{background:#ff5b6e;}

@media(max-width:768px){
.btns{
grid-template-columns:1fr;
}
}
</style>
</head>
<body>

<a class="back" href="/zones">⬅ กลับ</a>

<h1>{{title}}</h1>

{% for group,data in groups.items() %}
<div class="grid">

{% for cage,item in data.items() %}
<div class="card">

<div class="cage">{{cage}}</div>

{% if item %}

<div class="name">👤 {{item.customer}}</div>
<div>🐔 {{item.mother}}</div>
<div>🐓 {{item.father}}</div>

{% if item.alert %}
<div class="alert">{{item.alert}}</div>
{% endif %}

<div class="btns">
<a class="btn status" href="/status/{{cage}}">สถานะ</a>
<a class="btn update" href="/update/{{cage}}">อัปเดต</a>
<a class="btn finish" href="/finish/{{cage}}">จบงาน</a>
</div>

{% else %}

<div class="empty">🟢 ล็อคว่าง</div>

{% endif %}

</div>
{% endfor %}

</div>
{% endfor %}

</body>
</html>
