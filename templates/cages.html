<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
@import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;500;700&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Prompt',sans-serif;
}

body{
background:linear-gradient(135deg,#f7f3eb,#e5dccf);
padding:40px;
color:#2f2419;
}

h1{
font-size:48px;
margin-bottom:30px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(380px,1fr));
gap:25px;
}

.card{
background:#fffaf2;
border-radius:26px;
padding:28px;
box-shadow:0 18px 35px rgba(0,0,0,.08);
border:1px solid #eadfce;
}

.cage{
font-size:34px;
font-weight:700;
color:#6d4c2f;
margin-bottom:15px;
}

.customer{
font-size:20px;
margin-bottom:8px;
}

.alert{
font-size:18px;
color:#e67e22;
margin-bottom:20px;
}

.btns{
display:flex;
gap:12px;
flex-wrap:wrap;
}

.btn{
padding:14px 18px;
border-radius:16px;
text-decoration:none;
font-weight:700;
font-size:16px;
color:white;
transition:.25s;
display:inline-block;
}

.btn:hover{
transform:translateY(-3px);
}

.status{
background:linear-gradient(135deg,#377dff,#4da8ff);
}

.update{
background:linear-gradient(135deg,#f39c12,#ffb347);
}

.finish{
background:linear-gradient(135deg,#2ecc71,#27ae60);
}

.back{
position:fixed;
top:25px;
right:25px;
background:#6d4c2f;
color:white;
padding:16px 24px;
border-radius:18px;
text-decoration:none;
font-weight:700;
}
</style>
</head>
<body>

<a class="back" href="/zones">← กลับ</a>

<h1>{{title}}</h1>

<div class="grid">

{% for k,v in groups[title].items() %}
{% if v %}

<div class="card">

<div class="cage">{{k}}</div>

<div class="customer">👤 {{v.customer}}</div>

<div class="alert">
{{v.alert if v.alert else "ปกติ"}}
</div>

<div class="btns">

<a href="{{ url_for('status', cage=k) }}" class="btn status">
📋 สถานะ
</a>

<a href="{{ url_for('update', cage=k) }}" class="btn update">
✏️ อัปเดต
</a>

<a href="{{ url_for('finish', cage=k) }}" class="btn finish">
✅ จบงาน
</a>

</div>

</div>

{% endif %}
{% endfor %}

</div>

</body>
</html>
